source = ~/.cache/colors/colors.conf

general {
}

background {
    monitor =
    path = $image
    noise = 0.20
    contrast = 0.8
    brightness = 0.8
    vibrancy = 0.2
}
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = $primary
    font_size = 120
    font_family = JetBrainsMono Nerd Font 900
    
    position = 0, 60
    halign = center
    valign = center
    
    shadow_passes = 4
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 1.0)
}
label {
    monitor =
    text = cmd[update:43200000] date +"%A, %B %d"
    color = $on_surface_variant
    font_size = 24
    font_family = JetBrainsMono Nerd Font 900
    
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}
input-field {
    monitor =
    size = 340, 65
    outline_thickness = 5
    dots_size = 0.25 
    dots_spacing = 0.4 
    dots_center = true
    outer_color = $outline_variant
    inner_color = $surface_container_lowest
    font_color = $on_background
    fade_on_empty = false
    rounding = 10
    placeholder_text = <span font_family="JetBrainsMono Nerd Font" font_weight="900" foreground="##b9c9d0">Enter Password 󰌾 </span>
    hide_input = false
    position = 0, -180
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 9
    shadow_color = $scrim
    check_color = $primary
    fail_color = $error
    fail_text = <span font_family="JetBrainsMono Nerd Font" font_weight="900"><i>$FAIL <b>($ATTEMPTS)</b></i></span>
}
