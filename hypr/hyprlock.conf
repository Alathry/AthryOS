source = ~/.cache/colors/colors.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = $image
    noise = 0.20
    contrast = 0.8
    brightness = 0.8
    vibrancy = 0.2
}
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = $primary
    font_size = 90
    font_family = Fixedsys Excelsior 900
    
    position = 0, 280
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:40] ~/.config/hypr/scripts/cava.sh
    color = $on_background
    font_color = $on_background
    font_size = 16
    font_family = JetBrainsMono Nerd Font 900
    position = 0, 0
    halign = center
    valign = bottom
}
shape {
    monitor =
    size = 360, 60 
    color = $surface_container_lowest
    border_size = 3
    border_color = $outline_variant
    rounding = 12 
    position = 0, -10 
    halign = center
    valign = bottom
    zindex = -1 
}
input-field {
    monitor =
    size = 340, 65
    outline_thickness = 5
    dots_size = 0.25 
    dots_spacing = 0.4 
    dots_center = true
    outer_color = $outline_variant
    inner_color = $surface_container_lowest
    font_color = $on_background
    fade_on_empty = false
    rounding = 0
    placeholder_text = <span font_family="Perfect DOS VGA 437" font_weight="900" foreground="##b9c9d0">Enter Password 󰌾 </span>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
    check_color = $primary
    fail_color = $error
    fail_text = <span font_family="Perfect DOS VGA 437" font_weight="900"><i>$FAIL <b>($ATTEMPTS)</b></i></span>
}
